version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-tooling:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /Android-Version/Game2048
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      android-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
