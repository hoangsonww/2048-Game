name: Release

# Publishes an installable Android APK alongside each tagged release so that
# players can try the Android client without installing a JDK, the Android SDK,
# or Gradle. The web client needs no release artifact — it is deployed
# continuously to GitHub Pages.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the APK to (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build and attach the Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Android-Version/Game2048

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the client before publishing
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Resolve the release tag
        id: release_tag
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing artifacts for ${TAG}"

      - name: Name the APK after the release
        working-directory: ${{ github.workspace }}
        run: |
          SRC="Android-Version/Game2048/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC" || { echo "APK not found at $SRC" >&2; exit 1; }
          cp "$SRC" "2048-${{ steps.release_tag.outputs.tag }}-debug.apk"
          ls -lh "2048-${{ steps.release_tag.outputs.tag }}-debug.apk"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: 2048-${{ steps.release_tag.outputs.tag }}-debug.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" "2048-${TAG}-debug.apk" --clobber
