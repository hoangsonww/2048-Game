name: Cut release

# A release is cut only from a version that has already reached protected main
# through a reviewed pull request. The workflow never creates or pushes a new
# commit: it tags the checked-out main commit when v<VERSION> does not exist,
# dispatches the artifact build, and verifies the published result.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents: push the version tag and inspect the resulting release.
  # actions: dispatch release.yml. Read access cannot start a workflow run.
  contents: write
  actions: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Publish the version on main
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify the current version is consistent
        run: ./scripts/version.sh check

      # VERSION and every derived client version must be changed in the pull
      # request. Tags are not protected-branch updates, so publishing the
      # already-reviewed commit works without bypassing branch protection.
      - name: Publish the version tag when needed
        id: tag
        run: |
          set -Eeuo pipefail
          version="$(./scripts/version.sh)"
          ./scripts/publish-version-tag.sh "${version}"

      - name: Check for a complete release
        id: release_status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if release="$(gh release view "${TAG}" --json assets 2>/dev/null)"; then
            assets="$(jq -r '.assets | length' <<< "${release}")"
          else
            release='{"assets":[]}'
            assets=0
          fi
          complete=true
          if (( assets < 3 )); then
            complete=false
          fi
          for expected in \
            "2048-${TAG}-debug.apk" \
            "2048-${TAG}-ios-unsigned.zip" \
            "2048-${TAG}-web.zip"; do
            if ! jq -e --arg name "${expected}" 'any(.assets[]; .name == $name)' <<< "${release}" >/dev/null; then
              complete=false
            fi
          done
          if [[ "${complete}" == true ]]; then
            echo "complete=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} already has ${assets} assets."
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} is absent or incomplete (${assets} assets)."
          fi

      - name: Start the release build
        id: dispatch
        if: ${{ steps.release_status.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          before_ids="$(gh run list --workflow release.yml --branch "${TAG}" --limit 100 \
            --json databaseId --jq '.[].databaseId')"

          # A GITHUB_TOKEN tag push intentionally starts no second workflow, so
          # dispatch release.yml explicitly. Ref resolution can lag the push.
          dispatched=false
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --ref "${TAG}" -f "tag=${TAG}"; then
              echo "dispatched release.yml for ${TAG} on attempt ${attempt}"
              dispatched=true
              break
            fi
            echo "dispatch attempt ${attempt} failed; the tag may not be visible yet"
            sleep 10
          done
          if [[ "${dispatched}" != true ]]; then
            echo "::error::Could not dispatch release.yml for ${TAG}."
            echo "::error::The tag exists. Re-run Release manually with tag=${TAG}."
            exit 1
          fi

          # Capture the run created by this dispatch. Historical failures for
          # the same tag must not poison a successful retry.
          run_id=""
          deadline=$(( SECONDS + 120 ))
          while (( SECONDS < deadline )); do
            while IFS= read -r candidate; do
              [[ -n "${candidate}" ]] || continue
              if ! grep -Fqx -- "${candidate}" <<< "${before_ids}"; then
                run_id="${candidate}"
                break
              fi
            done < <(gh run list --workflow release.yml --branch "${TAG}" --limit 100 \
              --json databaseId --jq '.[].databaseId')
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::Could not find the Release run dispatched for ${TAG}."
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify a release was actually produced
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${RUN_ID}" ]]; then
            echo "Waiting for Release run ${RUN_ID} at ${TAG}..."
            run='{}'
            deadline=$(( SECONDS + 2400 ))
            while (( SECONDS < deadline )); do
              run="$(gh run view "${RUN_ID}" --json status,conclusion)"
              [[ "$(jq -r '.status' <<< "${run}")" == completed ]] && break
              sleep 30
            done
            status="$(jq -r '.status' <<< "${run}")"
            conclusion="$(jq -r '.conclusion // ""' <<< "${run}")"
            if [[ "${status}" != completed || "${conclusion}" != success ]]; then
              echo "::error::Release run ${RUN_ID} ended as ${conclusion:-${status}} for ${TAG}."
              exit 1
            fi
          fi

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::No GitHub Release exists for ${TAG}, despite the build succeeding."
            exit 1
          fi
          release="$(gh release view "${TAG}" --json assets)"
          assets="$(jq -r '.assets | length' <<< "${release}")"
          if [[ "${assets}" -lt 3 ]]; then
            echo "::error::Release ${TAG} has ${assets} file(s); expected the Android, iOS and web artifacts."
            exit 1
          fi
          for expected in \
            "2048-${TAG}-debug.apk" \
            "2048-${TAG}-ios-unsigned.zip" \
            "2048-${TAG}-web.zip"; do
            if ! jq -e --arg name "${expected}" 'any(.assets[]; .name == $name)' <<< "${release}" >/dev/null; then
              echo "::error::${expected} is missing from release ${TAG}."
              exit 1
            fi
          done
          echo "Release ${TAG} is published with ${assets} file(s):"
          jq -r '.assets[] | "  \(.name)"' <<< "${release}"

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_CREATED: ${{ steps.tag.outputs.should_release }}
          WAS_COMPLETE: ${{ steps.release_status.outputs.complete }}
        run: |
          {
            echo "### ${TAG}"
            echo
            if [[ "${WAS_COMPLETE}" == true ]]; then
              echo "The existing release was already complete; no build was needed."
            elif [[ "${TAG_CREATED}" == true ]]; then
              echo "Tagged the reviewed main commit and verified its release artifacts."
            else
              echo "Rebuilt the incomplete tagged release and verified its artifacts."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
